name: Backlog guard

# Fix PRs claim items with `Fixes: DF-…` and must not edit BACKLOG.md; the
# Stamp backlog workflow is its writer. Ledger PRs carry the `backlog` label.
# Re-runs on label changes so adding the label after opening clears the check.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: backlog-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guard:
    name: Backlog guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fix PRs must not edit BACKLOG.md
        env:
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'backlog') }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$HAS_LABEL" = true ]; then echo "backlog label present; ledger edit allowed."; exit 0; fi
          if git diff --name-only "$BASE...$HEAD" | grep -qx BACKLOG.md; then
            echo "::error::Fix PRs must not edit BACKLOG.md. Claim the item with 'Fixes: DF-…' in the PR title or body; the Stamp backlog workflow marks it done after merge. Ledger-only PRs need the 'backlog' label."
            exit 1
          fi
          echo "BACKLOG.md untouched; ok."
