version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      vite:
        patterns:
          - vite
          - "@vitejs/*"
          - "@tailwindcss/vite"
      testing:
        patterns:
          - vitest
          - "@vitest/*"
          - "@testing-library/*"
          - jsdom
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
